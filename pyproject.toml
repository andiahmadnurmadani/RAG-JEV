[project]
name = "rag-service"
version = "1.0.0"
description = "Multi-tenant RAG & Jev AI service (FastAPI + Qdrant + BGE + Qwen)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "evaluation: RAG quality measurements (slow-ish, runs the real pipeline)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
