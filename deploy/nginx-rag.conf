# Contoh reverse proxy nginx untuk RAG Service (lihat docs/deployment.md §9c).
#
# Pasang:
#   sudo cp deploy/nginx-rag.conf /etc/nginx/sites-available/rag-service
#   sudo ln -s /etc/nginx/sites-available/rag-service /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rag.example.com     # lalu aktifkan blok TLS di bawah

upstream rag_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rag.example.com;

    # WAJIB >= MAX_UPLOAD_MB di .env, kalau tidak unggahan ditolak nginx (413)
    # sebelum sampai ke aplikasi.
    client_max_body_size 32m;

    # Jangan pernah membocorkan berkas internal bila root salah konfigurasi.
    location ~ /\.(env|git) { deny all; }

    # ---------- API ----------
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Harus > LLM_TIMEOUT (default 120 s): kueri RAG bisa lama karena
        # retrieval + rerank + generasi.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Respons panjang tidak ditahan buffer supaya klien menerima progres
        # lebih awal (dan tidak timeout di tengah).
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- Sisanya: /ui/ (konsol), /guide/ (dokumentasi), /docs + /redoc, /openapi.json ----------
    # Hanya satu blok: aplikasi sudah menangani redirect / -> /ui/ dan seluruh
    # berkas statisnya, jadi tidak ada aturan yang diduplikasi di nginx.
    location / {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---------- TLS (aktifkan setelah certbot) ----------
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/rag.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rag.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;
    #
    # Setelah TLS aktif, arahkan HTTP ke HTTPS:
    #   if ($scheme != "https") { return 301 https://$host$request_uri; }
}
