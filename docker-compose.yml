# Reference deployment: RAG API + Qdrant (PRD 43).
#
# The LLM and Jev are external dependencies; point LLM_BASE_URL / JEV_MCP_URL at
# them instead of shipping a model inside this compose file.
#
#   docker compose up -d --build
#   curl -s localhost:8000/api/v1/health

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  rag-api:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_LOCAL_PATH: /data/qdrant
      STORAGE_DIR: /data/storage
      SPARSE_DIR: /data/sparse
      JOB_STORE_PATH: /data/jobs.json
    volumes:
      - rag_data:/data
      - model_cache:/root/.cache
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).status == 200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  qdrant_data:
  rag_data:
  model_cache:
